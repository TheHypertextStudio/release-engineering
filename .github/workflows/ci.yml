name: Verify release engineering
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framework-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: python -m pip install .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
        working-directory: tests/fixtures/websites
      - run: python -m unittest discover -s tests -p test_workers_framework_runtime.py -v
        env:
          STUDIO_FRAMEWORK_WORKERS_TESTS: '1'
          WRANGLER_SEND_METRICS: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
  verify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: python -m pip install .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - run: npm install --global pnpm@11.9.0
      - run: swift test --jobs 2
      - run: python -m unittest discover -s tests -v
        env:
          STUDIO_NATIVE_WORKERS_TESTS: '1'
          WRANGLER_SEND_METRICS: 'false'
      - run: python scripts/build-release.py
