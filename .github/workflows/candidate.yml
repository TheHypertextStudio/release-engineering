name: Build immutable product candidate
on:
  workflow_call:
    inputs:
      tooling_revision:
        type: string
        required: true
      runner:
        type: string
        default: macos-26
permissions:
  contents: write
  actions: read
  packages: read
  id-token: write
jobs:
  candidate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STUDIO_DISPATCH_TOKEN: ${{ secrets.STUDIO_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the pinned implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ inputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - name: Install the shared runtime
        run: python -m pip install --disable-pip-version-check ./.studio-engine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Prepare the native toolchain
        id: toolchain
        run: python -m studio.ci_setup
      - name: Prepare declared Java
        if: steps.toolchain.outputs.java != ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - name: Prepare declared .NET
        if: steps.toolchain.outputs.dotnet != ''
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ steps.toolchain.outputs.dotnet }}.x
      - name: Authenticate the product workload identity
        if: vars.STUDIO_STAGING_WIF_PROVIDER != '' && vars.STUDIO_STAGING_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.STUDIO_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STUDIO_STAGING_SERVICE_ACCOUNT }}
      - name: Install the provider CLI
        if: vars.STUDIO_STAGING_WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Prepare the declared credential bindings
        run: python -m studio.credentials
      - name: Record release prerequisites
        run: python -m studio.diagnostics
      - name: Prepare dependencies
        run: python -m studio setup
      - name: Assemble and stage the immutable candidate
        env:
          STUDIO_TOOLING_REVISION: ${{ inputs.tooling_revision }}
        run: python -m studio.ci create --tooling-revision "$STUDIO_TOOLING_REVISION"
      - name: Save candidate and review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .studio/candidate
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Record readiness and notify the product owner
        run: python -m studio.ci ready
      - name: Remove ephemeral signing credentials
        if: always()
        run: python -m studio.credentials cleanup
      - name: Preserve release prerequisites and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .studio/prerequisites.json
            build/*.xcresult
          if-no-files-found: ignore
