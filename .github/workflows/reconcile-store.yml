name: Reconcile authorized App Store releases
on:
  workflow_call:
    inputs:
      tooling_revision:
        type: string
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: studio-production-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ inputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: python -m pip install ./.studio-engine
      - run: python -m studio.ci reconcile
