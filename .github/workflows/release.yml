name: Publish verified lifecycle runtime
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: python -m pip install .
      - run: swift test --jobs 2
      - run: python -m unittest discover -s tests
      - run: python scripts/build-release.py
      - name: Publish checksum-bound runtime
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$STUDIO_RELEASE_TAG" dist/studio.pyz dist/SHA256SUMS --verify-tag --title "$STUDIO_RELEASE_TAG" --generate-notes
