name: Promote reviewed immutable candidate
on:
  workflow_call:
    inputs:
      tooling_revision:
        type: string
        required: true
      product_root:
        type: string
        default: '.'
      release_action:
        type: string
        default: promote
      runner:
        type: string
        default: macos-26
      candidate_id:
        type: string
        required: true
      manifest_sha256:
        type: string
        required: true
      evidence:
        type: string
        required: true
permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
concurrency:
  group: studio-production-${{ github.repository }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    environment: production
    env:
      STUDIO_ENGINE_ROOT: ${{ github.workspace }}/.studio-engine
      STUDIO_CANDIDATE_ID: ${{ inputs.candidate_id }}
      STUDIO_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      STUDIO_RELEASE_ACTION: ${{ inputs.release_action }}
      STUDIO_REVIEW_EVIDENCE: ${{ inputs.evidence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the pinned implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ inputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - name: Install the shared runtime
        run: python -I -m pip install --disable-pip-version-check ./.studio-engine
      - name: Resolve the dispatch product root
        id: dispatch-root
        env:
          STUDIO_PRODUCT_ROOT: ${{ inputs.product_root }}
        run: python -I -m studio.product_root "$STUDIO_PRODUCT_ROOT"
      - name: Fetch and verify the exact reviewed artifact
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_DISPATCH_ROOT: ${{ steps.dispatch-root.outputs.product_root_path }}
          STUDIO_PRODUCT_ROOT: ${{ inputs.product_root }}
        run: python -I -m studio.ci download --root "$STUDIO_DISPATCH_ROOT" --product-root "$STUDIO_PRODUCT_ROOT" --output "$GITHUB_WORKSPACE/.studio/candidate" --candidate-id "$STUDIO_CANDIDATE_ID" --manifest-sha256 "$STUDIO_MANIFEST_SHA256"
      - name: Check out candidate source for provider bindings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          path: .studio-source
          persist-credentials: false
      - name: Restore the candidate implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ steps.candidate.outputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - name: Resolve the reviewed source root
        id: candidate-root
        env:
          STUDIO_PRODUCT_ROOT: ${{ steps.candidate.outputs.product_root }}
        run: python -I -m studio.product_root --checkout .studio-source "$STUDIO_PRODUCT_ROOT"
      - name: Validate reviewed policy and toolchain before credentials
        id: reviewed-toolchain
        env:
          STUDIO_CANDIDATE_ROOT: ${{ steps.candidate-root.outputs.product_root_path }}
        run: python -I -m studio.ci_setup --candidate "$GITHUB_WORKSPACE/.studio/candidate" --source "$STUDIO_CANDIDATE_ROOT" --validate-only
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.reviewed-toolchain.outputs.node != ''
        with:
          node-version: ${{ steps.reviewed-toolchain.outputs.node }}
      - name: Prepare the reviewed toolchain
        id: toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          STUDIO_CANDIDATE_ROOT: ${{ steps.candidate-root.outputs.product_root_path }}
        run: python -I -m studio.ci_setup --candidate "$GITHUB_WORKSPACE/.studio/candidate" --source "$STUDIO_CANDIDATE_ROOT"
      - name: Prepare declared Java
        if: steps.toolchain.outputs.java != ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - name: Prepare declared .NET
        if: steps.toolchain.outputs.dotnet != ''
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ steps.toolchain.outputs.dotnet }}.x
      - name: Authenticate the product workload identity
        if: vars.STUDIO_PRODUCTION_WIF_PROVIDER != '' && vars.STUDIO_PRODUCTION_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.STUDIO_PRODUCTION_WIF_PROVIDER }}
          service_account: ${{ vars.STUDIO_PRODUCTION_SERVICE_ACCOUNT }}
      - name: Install the provider CLI
        if: vars.STUDIO_PRODUCTION_WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Prepare the declared credential bindings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STUDIO_CANDIDATE_ROOT: ${{ steps.candidate-root.outputs.product_root_path }}
        run: python -I -m studio.credentials --root "$STUDIO_CANDIDATE_ROOT"
      - name: Install the exact candidate runtime
        run: python -I -m pip install --force-reinstall ./.studio-engine
      - name: Promote dependencies and distributions without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          STUDIO_CANDIDATE_ROOT: ${{ steps.candidate-root.outputs.product_root_path }}
        run: python -I -m studio.ci "$STUDIO_RELEASE_ACTION" --root "$STUDIO_CANDIDATE_ROOT" --output "$GITHUB_WORKSPACE/.studio/candidate" --manifest-sha256 "$STUDIO_MANIFEST_SHA256"
