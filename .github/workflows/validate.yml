name: Validate product lifecycle
on:
  workflow_call:
    inputs:
      tooling_revision:
        type: string
        required: true
      runner:
        type: string
        default: macos-26
permissions:
  contents: read
  packages: read
jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the pinned implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ inputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - name: Install the shared runtime
        run: python -m pip install --disable-pip-version-check ./.studio-engine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Prepare the native toolchain
        id: toolchain
        run: python -m studio.ci_setup
      - name: Prepare declared Java
        if: steps.toolchain.outputs.java != ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - name: Prepare declared .NET
        if: steps.toolchain.outputs.dotnet != ''
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: ${{ steps.toolchain.outputs.dotnet }}.x
      - name: Prepare dependencies
        run: python -m studio setup
      - name: Run product and lifecycle checks
        run: python -m studio check
      - name: Build through native tools
        run: python -m studio build
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/*.xcresult
            .studio/diagnostics
          if-no-files-found: ignore
