name: Update product lifecycle pins
on:
  workflow_call:
    inputs:
      tooling_revision:
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ inputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: python -m pip install ./.studio-engine
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.STUDIO_PIN_WIF_PROVIDER }}
          service_account: ${{ vars.STUDIO_PIN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Read the repository-scoped pin writer
        id: writer
        env:
          STUDIO_PIN_UPDATE_SECRET: ${{ vars.STUDIO_PIN_UPDATE_SECRET }}
        run: python -m studio.pin_credentials
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ssh-key: ${{ steps.writer.outputs.ssh_private_key }}
          clean: false
      - run: python -m studio.pins
      - name: Save one reviewable dependency branch
        run: |
          git config user.name studio-release-bot
          git config user.email release-bot@hypertext.studio
          git switch -c "studio/pins-$GITHUB_RUN_ID"
          git add run studio.lock.json .github/workflows
          git ls-files -z '*project.pbxproj' 'infrastructure/*.tf' | xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            python -c 'from pathlib import Path; Path("/tmp/studio-commit.txt").write_text("chore: Update the shared lifecycle revision\n\nKeep the launcher, workflows, Swift distribution package, and\nprovisioning modules on one reviewed release implementation.\n")'
            git commit -F /tmp/studio-commit.txt
            git push origin "studio/pins-$GITHUB_RUN_ID"
          fi
