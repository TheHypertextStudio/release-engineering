name: Update product lifecycle pins
on:
  workflow_call:
    inputs:
      tooling_revision:
        type: string
        required: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.STUDIO_PIN_UPDATE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.STUDIO_PIN_UPDATE_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ inputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: python -m pip install ./.studio-engine
      - run: python -m studio.pins
      - name: Save one reviewable dependency branch
        run: |
          git config user.name studio-release-bot
          git config user.email release-bot@hypertext.studio
          git switch -c "studio/pins-$GITHUB_RUN_ID"
          git add run studio.lock.json .github/workflows
          git ls-files -z '*project.pbxproj' 'infrastructure/*.tf' | xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            python -c 'from pathlib import Path; Path("/tmp/studio-commit.txt").write_text("chore: Update the shared lifecycle revision\n\nKeep the launcher, workflows, Swift distribution package, and\nprovisioning modules on one reviewed release implementation.\n")'
            git commit -F /tmp/studio-commit.txt
            git push origin "studio/pins-$GITHUB_RUN_ID"
          fi
