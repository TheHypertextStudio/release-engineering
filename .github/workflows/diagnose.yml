name: Inspect release credential prerequisites
on:
  workflow_call:
    inputs:
      tooling_revision:
        type: string
        required: true
      migration_public_key:
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      STUDIO_MIGRATION_PUBLIC_KEY: ${{ inputs.migration_public_key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheHypertextStudio/release-engineering
          ref: ${{ inputs.tooling_revision }}
          path: .studio-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: python -m pip install ./.studio-engine
      - name: Authenticate the product workload identity
        if: vars.STUDIO_STAGING_WIF_PROVIDER != '' && vars.STUDIO_STAGING_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.STUDIO_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STUDIO_STAGING_SERVICE_ACCOUNT }}
      - name: Install the provider CLI
        if: vars.STUDIO_STAGING_WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - run: python -m studio.diagnostics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-prerequisites
          path: |
            .studio/prerequisites.json
            .studio/sparkle-migration.enc
          if-no-files-found: error
